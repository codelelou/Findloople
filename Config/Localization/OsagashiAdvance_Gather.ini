DestinationPath=Content/Localization/OsagashiAdvance
ManifestName=OsagashiAdvance.manifest
ArchiveName=OsagashiAdvance.archive
NativeCulture=ja
CulturesToGenerate=ja
CulturesToGenerate=en

[GatherTextStep0]
